<!doctype html>
<html lang="fa" dir="rtl" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اکسیر · Aksir</title>
<meta name="description" content="Offline medicine scanner: read a package photo, get drug information in Persian. No internet needed.">
<meta name="theme-color" content="#080d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="./" aria-label="Aksir">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="color-mix(in srgb,var(--accent) 50%,#fff)"/></linearGradient></defs><circle cx="24" cy="24" r="20" fill="none" stroke="url(#lg)" stroke-width="3"/><g transform="rotate(-40 24 24)"><rect x="11" y="17" width="26" height="14" rx="7" fill="url(#lg)"/><path d="M24 17v14" stroke="var(--bg)" stroke-width="2.2"/></g><circle cx="37.6" cy="10.4" r="2.3" fill="#fff" opacity=".92"/></svg>
    <span class="wordmark"><b data-i18n="brand">اکسیر</b><i>Aksir</i></span>
  </a>
  <div class="top-actions">
    <span class="pill offline" id="netPill"><span class="dot"></span><span data-i18n="offlineReady">آفلاین آماده</span></span>
    <button class="icon-btn" id="langBtn" aria-label="Language"><span id="langLabel">EN</span></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </div>
</header>

<main id="main">
  <!-- ============ SCAN ============ -->
  <section class="view" id="v-scan">
    <div class="hero">
      <p class="eyebrow">READ · FIND · LISTEN</p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
    </div>

    <div class="card">
      <div class="card-head"><h2 data-i18n="scanTitle"></h2><span class="muted sm" id="imgCount"></span></div>
      <div class="drop" id="drop">
        <div class="drop-ico" id="dropIco"></div>
        <p data-i18n="dropText"></p>
        <div class="row">
          <button class="btn primary" id="camBtn" type="button"></button>
          <button class="btn" id="pickBtn" type="button"></button>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <input type="file" id="capture" accept="image/*" capture="environment" hidden>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <button class="btn primary wide" id="scanBtn" disabled></button>
      <div class="progress" id="progress" hidden>
        <div class="bar"><i id="barFill"></i></div>
        <p id="progressText" class="muted sm"></p>
      </div>
    </div>

    <div class="card" id="candCard" hidden>
      <div class="card-head"><h2 data-i18n="foundTitle"></h2><span class="chip" id="ocrChip"></span></div>
      <p class="warn-inline" data-i18n="verify"></p>
      <div class="cands" id="cands"></div>
      <div class="facts" id="facts"></div>
      <details class="more"><summary data-i18n="rawTitle"></summary><pre id="rawText"></pre></details>
    </div>

    <div class="card">
      <div class="card-head"><h2 data-i18n="searchTitle"></h2></div>
      <div class="search"><input id="q1" type="search" data-i18n-ph="searchPh" autocomplete="off" enterkeyhint="search"><div class="sugg" id="sugg1" hidden></div></div>
      <p class="fine" id="dbInfo"></p>
    </div>
  </section>

  <!-- ============ DRUG ============ -->
  <section class="view" id="v-drug" hidden>
    <button class="back" id="backBtn"></button>
    <div class="card drug-head" id="drugHead"></div>
    <div class="alts" id="alts"></div>
    <div class="card chat">
      <div class="card-head"><h2 data-i18n="askTitle"></h2></div>
      <div class="suggest" id="suggest"></div>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" data-i18n-ph="askPh" enterkeyhint="send">
        <button class="send" id="sendBtn" type="submit" aria-label="Send"></button>
      </form>
    </div>
    <div class="card"><div class="card-head"><h2 data-i18n="allInfo"></h2></div><div id="sections" class="acc"></div></div>
    <div class="row end noprint">
      <button class="btn soft" id="reportBtn"></button>
    </div>
    <p class="fine disc" data-i18n="disclaimer"></p>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="view" id="v-history" hidden>
    <div class="card">
      <div class="card-head"><h2 data-i18n="historyTitle"></h2></div>
      <div id="histList" class="hist"></div>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-v="scan" class="on"><span class="ti" data-ico="scan"></span><span data-i18n="tabScan"></span></button>
  <button data-v="history"><span class="ti" data-ico="clock"></span><span data-i18n="tabHistory"></span></button>
</nav>

<footer class="foot">
  <span data-i18n="footer"></span>
</footer>

<dialog id="settings">
  <form method="dialog" class="dlg-head">
    <h2 data-i18n="settingsTitle"></h2>
    <button class="icon-btn" value="x" aria-label="Close" id="closeSettings"></button>
  </form>
  <div class="tabpane">
    <label class="lab" data-i18n="appearance"></label>
    <div class="seg" id="appearSeg">
      <button data-v="dark" data-i18n="dark"></button>
      <button data-v="light" data-i18n="light"></button>
      <button data-v="system" data-i18n="system"></button>
    </div>
    <label class="lab" data-i18n="accent"></label>
    <div class="swatches" id="swatches"></div>
    <label class="custom"><input type="color" id="accentPick"><span data-i18n="customColor"></span></label>
    <label class="lab" data-i18n="fontSize"></label>
    <input type="range" id="fontSize" min="90" max="130" step="5">
    <label class="lab" data-i18n="ocrLangs"></label>
    <div class="seg" id="ocrSeg">
      <button data-v="fas+eng">فارسی + English</button>
      <button data-v="eng">English</button>
      <button data-v="fas">فارسی</button>
    </div>
    <h3 class="sub" data-i18n="voiceTitle"></h3>
    <p class="hint" id="voiceInfo"></p>
    <button class="btn sm" id="testVoice" type="button"></button>
    <h3 class="sub" data-i18n="dataTitle"></h3>
    <p class="hint" id="storageInfo"></p>
    <div class="row"><button class="btn sm danger" id="clearHist" type="button"></button><button class="btn sm" id="installBtn" type="button" hidden></button></div>
    <p class="hint" data-i18n="aboutText"></p>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="lib/tess/tesseract.min.js"></script>
<script src="data/aliases.js"></script>
<script src="data/aliases2.js"></script>
<script src="data/drugs.js"></script>
<script src="data/drugs_b1.js"></script>
<script src="data/drugs_b2.js"></script>
<script src="data/drugs_b3.js"></script>
<script src="data/drugs_b4.js"></script>
<script src="data/drugs_b5.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
